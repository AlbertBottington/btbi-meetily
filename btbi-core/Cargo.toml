[package]
name = "btbi-core"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"], optional = true }

[features]
worker = ["dep:keyring"]
token-store = ["dep:keyring"]

[[bin]]
name = "btbi-cloud-worker"
path = "src/bin/btbi-cloud-worker.rs"
required-features = ["worker"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
